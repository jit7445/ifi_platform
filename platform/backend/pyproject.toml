[project]
name = "ifl-platform-backend"
version = "0.1.0"
description = "Infollion expert evaluation platform, Phase 1 MVP backend"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30",
    "psycopg[binary,pool]>=3.2",
    "alembic>=1.13",
    "procrastinate>=2.0",
    "boto3>=1.34",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "pyotp>=2.9",
    "numpy>=1.26",
    "email-validator>=2.1",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
package = false
